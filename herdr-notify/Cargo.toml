[package]
name = "herdr-notify"
version = "0.1.0"
edition = "2021"
description = "Real-time herdr agent attention notifications: desktop (notify-send) and phone (omarchy-link /omarchy/notify)."
license = "MIT"

[dependencies]
libherdr = { path = "../libherdr" }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
