[package]
name = "ares-app"
version = "0.1.0"
edition = "2021"
description = "Native Ares client — Hermes TUI per room in VTE + native artifact viewer"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
vte4 = "0.8"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
async-channel = "2"

[profile.release]
lto = "thin"
